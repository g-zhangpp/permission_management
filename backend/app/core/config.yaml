app:
  name: "权限管理系统"
  version: "1.0.0"
  debug: true

server:
  host: "0.0.0.0"
  port: 8000

database:
  url: "mysql+pymysql://root:root123.@10.192.161.230:3306/monitor"
  echo: true

redis:
  host: "localhost"
  port: 6379
  db: 0

jwt:
  secret_key: "your-secret-key"
  algorithm: "HS256"
  access_token_expire_minutes: 30

cors:
  origins:
    - "*"
  credentials: true
  methods:
    - "*"
  headers:
    - "*"

# 日志配置
logger:
  # 日志保存目录
  log_dir: "./logs"
  # 日志文件名
  log_file: "app.log"
  # 是否开启debug模式
  debug: true

# 初始化数据
init_data:
  # 初始化用户
  users:
    - username: "admin"
      password: "root123"
      email: "admin@example.com"
      roles: ["admin"]
  # 初始化角色
  roles:
    - name: "admin"
      description: "系统管理员角色，拥有所有权限"
    - name: "common"
      description: "普通用户角色，拥有基础权限"
  # 初始化菜单
  menus:
    - name: "首页"
      path: "/dashboard"
      component: "Dashboard"
      icon: "home"
      parent_id: null
      order: 1
    - name: "用户管理"
      path: "/user"
      component: "User"
      icon: "user"
      parent_id: null
      order: 2
    - name: "用户管理"
      path: "/user/list"
      component: "UserList"
      icon: "user"
      parent_id: 2
      order: 1
    - name: "角色管理"
      path: "/user/role"
      component: "RoleList"
      icon: "role"
      parent_id: 2
      order: 2
    - name: "权限管理"
      path: "/user/permission"
      component: "PermissionList"
      icon: "permission"
      parent_id: 2
      order: 3
